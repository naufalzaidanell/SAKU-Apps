name: SAKU Full Stack Gate

on:
  push:
    branches:
      - agent/saku-mobile-2-release-ready
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'mobile2/**'
      - 'services/onboarding-api/**'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'mobile2/**'
      - 'services/onboarding-api/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # pinned
        with:
          node-version: '22'

      - name: Verify web clients and workflow security
        run: |
          node --check apps/mobile-web/app.js
          node --check apps/admin-web/admin.js
          node --test test/*.test.mjs

      - name: Install and verify additive backend
        working-directory: services/onboarding-api
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Credential and private-key gate
        run: |
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '.env' -o -name '.env.production' \) -print -quit | grep -q .; then
            echo 'Credential-bearing file detected' >&2
            exit 1
          fi
          if grep -RIlE --exclude='*.example' --exclude='*.md' --exclude-dir='.git' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16})' . | head -n 1 | grep -q .; then
            echo 'Potential embedded private credential detected' >&2
            exit 1
          fi
