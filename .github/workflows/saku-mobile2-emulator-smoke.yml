name: SAKU Mobile 2 Emulator Smoke

on:
  push:
    branches:
      - agent/saku-mobile-2-release-ready
    paths:
      - '.github/workflows/saku-mobile2-emulator-smoke.yml'
      - 'mobile2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout native branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@3487f54461fe81d2d61c9e3b374b8504291689fa # pinned
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # pinned

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # pinned
        with:
          gradle-version: '8.14.3'

      - name: Build native preview APK
        working-directory: mobile2
        run: |
          gradle --no-daemon assembleDebug -PSAKU_ENVIRONMENT=uat

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Cold launch and capture native auth UI
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r mobile2/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.saku.umkm.mobile2preview
            adb shell am start -W -n com.saku.umkm.mobile2preview/com.saku.umkm.MainActivity > mobile2/launch.txt
            sleep 4
            test -n "$(adb shell pidof com.saku.umkm.mobile2preview | tr -d '\r')"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml mobile2/window.xml >/dev/null
            grep -q 'text="SAKU"' mobile2/window.xml
            grep -Eq 'text="Masuk"|text="Masuk ke SAKU"' mobile2/window.xml
            adb exec-out screencap -p > mobile2/native-auth.png
            adb logcat -d -v brief > mobile2/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime:.*FATAL' mobile2/logcat.txt >/dev/null
            echo Native cold launch PASS

      - name: Upload emulator evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saku-mobile2-emulator-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile2/native-auth.png
            mobile2/window.xml
            mobile2/launch.txt
            mobile2/logcat.txt
